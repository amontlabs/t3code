name: lastdrop release retry

# GitHub's free macOS arm64 runners are sometimes all busy: a release job that no runner picks up
# is cancelled after 15 minutes ("The job was not acquired by Runner of type hosted"), and a rerun
# minutes later usually gets one. GitHub also keeps disabling lastdrop-release.yml on this fork,
# and a run that finishes or a tag pushed while it is disabled starts no workflow_run or push run,
# so this checks the newest fork tag on a schedule instead. See FORK.md, "Releases".

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: lastdrop-release-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Rerun the newest release if no runner took it
        shell: bash
        run: |
          set -euo pipefail
          # Only the newest tag: publishing an older one late with --latest would point the update
          # feed back at an older version.
          tag="$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref' |
            sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-ld\.[0-9]+$' | sort -V | tail -1)"
          [[ -n "$tag" ]] || { echo "No fork tag."; exit 0; }
          if gh api --silent "repos/$REPO/releases/tags/$tag" 2>/dev/null; then
            echo "$tag is released."
            exit 0
          fi
          enable() { gh api --silent -X PUT "repos/$REPO/actions/workflows/lastdrop-release.yml/enable"; }

          run="$(gh api "repos/$REPO/actions/workflows/lastdrop-release.yml/runs?branch=$tag&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.run_attempt)"')"
          if [[ -z "$run" ]]; then
            enable
            gh workflow run lastdrop-release.yml --repo "$REPO" --ref "$tag"
            echo "$tag had no release run; started one." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          read -r id status attempt <<<"$run"
          [[ "$status" == "completed" ]] || { echo "$tag run $id is $status."; exit 0; }
          state="$(gh api "repos/$REPO/actions/runs/$id/attempts/$attempt/jobs" \
            --jq '[.jobs[] | select(.name == "Release macOS arm64")][0]
                  | if . != null and .conclusion == "cancelled" and ((.runner_name // "") == "")
                    then "unacquired" else "ran" end')"
          if [[ "$state" != "unacquired" ]]; then
            echo "$tag attempt $attempt ran on a runner; a failed build is not retried."
            exit 0
          fi
          if (( attempt > 6 )); then
            echo "::warning::No macOS runner took $tag after 6 retries. Rerun it by hand later."
            exit 0
          fi
          enable
          gh run rerun "$id" --repo "$REPO"
          echo "Retry $attempt of $tag (run $id)." | tee -a "$GITHUB_STEP_SUMMARY"
