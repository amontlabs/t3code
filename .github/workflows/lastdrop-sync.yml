name: lastdrop sync

# Every hour: when upstream (pingdotgg/t3code) has a newer stable tag (vX.Y.Z) than the one
# `lastdrop` is based on, merge it into `lastdrop`, check it (fork guard, typecheck, tests, build),
# then move `lastdrop` and push tag v<X.Y.Z>-ld.<n>, which releases. Claude Code resolves merge
# conflicts and gets one attempt at fixing red checks; a sync still stuck after that pushes
# lastdrop-sync/<tag> with a PR labelled lastdrop-sync. FORK.md, "Sync", has the whole flow.
#
# Scheduled and manual runs use this file from the default branch, so it must be there.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to sync to (empty = newest stable tag). A dry run takes any upstream ref, such as main.
        required: false
        type: string
      dry_run:
        description: Dry run (push, open and release nothing; the outcome is in the run summary)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: lastdrop-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/pingdotgg/t3code.git
  CLAUDE_CODE_VERSION: 2.1.325

# An explicit bash runs with pipefail, so a failing command piped into tee fails its step.
defaults:
  run:
    shell: bash

jobs:
  sync:
    name: Merge the new upstream tag and check it
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      head: ${{ steps.plan.outputs.head }}
      ready: ${{ steps.ready.outputs.ready }}
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      # Only the push steps get LASTDROP_SYNC_TOKEN, so Claude's steps never see it.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
    steps:
      - name: Checkout lastdrop
        uses: actions/checkout@v6
        with:
          ref: lastdrop
          fetch-depth: 0

      # No credentials in the checkout, so the Claude steps cannot push. (persist-credentials: false
      # fails here: its cleanup walks submodules and trips on a nested gitlink under .repos/.)
      - name: Remove checkout credentials
        run: |
          set -euo pipefail
          git config --local --name-only --get-regexp '^(http\..*\.extraheader|includeif\..*|include\..*)$' | sort -u |
            while read -r key; do git config --local --unset-all "$key"; done || true
          if git config --get-regexp 'extraheader' > /dev/null; then
            echo "::error::The checkout still carries credentials."
            exit 1
          fi

      # Upstream's workflows come along with every sync; on this fork they would fail or wait
      # forever for upstream's runners. Turn off every workflow that is not the fork's own.
      - name: Turn off upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | select(.state == "active") | .path' |
            while read -r path; do
              case "$(basename "$path")" in
                lastdrop-*) ;;
                *) gh workflow disable "$(basename "$path")" --repo "$GITHUB_REPOSITORY" || true ;;
              esac
            done

      - name: Find the new upstream tag
        id: plan
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags "$UPSTREAM" '+refs/tags/v*:refs/tags/v*'
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' HEAD)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$DRY_RUN" == true ]]; then
            tag="${REQUESTED_TAG:-main}"
            git fetch --no-tags "$UPSTREAM" "$tag"
            base="$(git rev-parse 'FETCH_HEAD^{commit}')"
            echo "Dry run: lastdrop is based on $previous; syncing to $tag ($base)."
          else
            tag="${REQUESTED_TAG:-$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)}"
            echo "lastdrop is based on $previous; newest stable upstream tag is $tag."
            if [[ "$tag" == "$previous" || "$(printf '%s\n%s\n' "$previous" "$tag" | sort -V | tail -1)" != "$tag" ]]; then
              echo "Nothing to sync."
              exit 0
            fi
            if git ls-remote --exit-code --heads origin "lastdrop-sync/$tag" > /dev/null; then
              echo "::notice::lastdrop-sync/$tag already exists: a sync to $tag is waiting to be resolved (see its PR)."
              # Without its PR the app shows no warning, so a stuck sync would wait unseen.
              if [[ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "lastdrop-sync/$tag" --state open --json number --jq '.[].number')" ]]; then
                gh label create lastdrop-sync --repo "$GITHUB_REPOSITORY" --color D93F0B \
                  --description "A fork update that needs attention (the app warns while one is open)" --force
                gh pr create --repo "$GITHUB_REPOSITORY" --base lastdrop --head "lastdrop-sync/$tag" \
                  --label lastdrop-sync --title "Sync to $tag: needs attention" \
                  --body "A sync to \`$tag\` stopped and its PR was missing. Its run's summary has the details. Resolve it following FORK.md (\"Resolving a sync\"), then close this PR and delete \`lastdrop-sync/$tag\`."
              fi
              exit 0
            fi
            base="$(git rev-parse "refs/tags/$tag^{commit}")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Prepare
        if: steps.plan.outputs.tag != ''
        env:
          PUSH_TOKEN: ${{ secrets.LASTDROP_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$PUSH_TOKEN" ]] || missing+=(LASTDROP_SYNC_TOKEN)
          [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]] || missing+=(CLAUDE_CODE_OAUTH_TOKEN)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See FORK.md, \"Sync\"."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The merge rewrites the checkout, so keep this run's prompts, scripts and FORK.md aside.
          tools="$RUNNER_TEMP/lastdrop-sync"
          mkdir -p "$tools"
          cp FORK.md scripts/lastdrop/sync-* "$tools/"
          {
            echo "TOOLS=$tools"
            echo "FORK_MD=$tools/FORK.md"
            echo "NOTES=$RUNNER_TEMP/claude-notes.md"
            echo "TAG=${{ steps.plan.outputs.tag }}"
            echo "BASE=${{ steps.plan.outputs.base }}"
            echo "PREVIOUS=${{ steps.plan.outputs.previous }}"
            echo "PRE_MERGE=${{ steps.plan.outputs.head }}"
          } >> "$GITHUB_ENV"

      # A merge, not a rebase: only files both sides changed since the last sync can conflict (the
      # seams), they are resolved once, and lastdrop's history is never rewritten.
      - name: Merge (Claude resolves conflicts)
        id: merge
        if: steps.plan.outputs.tag != ''
        timeout-minutes: 60
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/merge.log"
          if git merge --no-ff -m "lastdrop: merge upstream $TAG" "$BASE" > "$log" 2>&1; then
            echo "Merged cleanly."
            exit 0
          fi
          # The lockfile is upstream's, regenerated after the merge; no need for Claude.
          if git diff --name-only --diff-filter=U | grep -qx pnpm-lock.yaml; then
            git checkout --theirs pnpm-lock.yaml && git add pnpm-lock.yaml
          fi
          if [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
            git commit --no-edit && exit 0
          fi
          echo "The merge stopped on conflicts:"
          git diff --name-only --diff-filter=U | tee -a "$log"
          bash "$TOOLS/sync-claude.sh" "$TOOLS/sync-resolve.md" sonnet 5 2>&1 | tee "$RUNNER_TEMP/claude-resolve.log" || true
          if [[ -f .git/MERGE_HEAD ]]; then
            echo "::error::Claude did not finish the merge."
            exit 1
          fi

      - name: Setup Vite+
        if: steps.plan.outputs.tag != ''
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Regenerate the lockfile
        if: steps.plan.outputs.tag != ''
        run: |
          set -euo pipefail
          # Git merges the lockfile's text without a conflict and can leave it broken, so start from upstream's.
          git checkout "$BASE" -- pnpm-lock.yaml
          vp install --lockfile-only --ignore-scripts
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git commit -m "lastdrop: lockfile for $TAG" -- pnpm-lock.yaml
          fi

      # zsh: lastdrop-node's judge tests run fake agy scripts with it, as macOS does.
      - name: Install browser secret helper build libraries and zsh
        if: steps.plan.outputs.tag != ''
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config zsh

      - name: Setup dependencies
        if: steps.plan.outputs.tag != ''
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        if: steps.plan.outputs.tag != ''
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install Chromium for browser tests
        if: steps.plan.outputs.tag != ''
        run: |
          node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
          node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium

      - name: Checks
        id: checks
        if: steps.plan.outputs.tag != ''
        continue-on-error: true
        run: bash "$TOOLS/sync-checks.sh" "$BASE" "$RUNNER_TEMP/checks.log"

      - name: Claude fixes the checks
        id: fix
        if: steps.checks.outcome == 'failure'
        timeout-minutes: 90
        env:
          CHECKS_LOG: ${{ runner.temp }}/checks.log
          CHECKS_DIGEST: ${{ runner.temp }}/checks.digest.md
        run: |
          set -uo pipefail
          before="$(git rev-parse HEAD)"
          bash "$TOOLS/sync-claude.sh" "$TOOLS/sync-fix.md" opus 15 2>&1 | tee "$RUNNER_TEMP/claude-fix.log" || true
          git add -A
          git diff --cached --quiet || git commit -m "lastdrop: fixes for $TAG"
          if [[ "$(git rev-parse HEAD)" != "$before" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Claude changed nothing."
          fi

      # The first pass and Claude's own test runs can leave test browsers or vitest workers behind;
      # in two runs the web tests then crashed the browser for lack of memory in the second pass only.
      - name: Free memory left over from the first pass
        if: steps.fix.outputs.changed == 'true'
        run: |
          free -m
          ps -eo rss,pid,comm --sort=-rss | head -15
          pkill -f -e 'chrome|chromium|headless_shell|vitest|playwright' || true
          sleep 2
          free -m

      - name: Checks again
        id: recheck
        if: steps.fix.outputs.changed == 'true'
        continue-on-error: true
        run: bash "$TOOLS/sync-checks.sh" "$BASE" "$RUNNER_TEMP/recheck.log"

      - name: Push the checked branch
        id: ready
        if: steps.plan.outputs.tag != ''
        env:
          PUSH_TOKEN: ${{ secrets.LASTDROP_SYNC_TOKEN }}
          CHECKS: ${{ steps.checks.outcome }}
          RECHECK: ${{ steps.recheck.outcome }}
        run: |
          set -euo pipefail
          if [[ "$CHECKS" != success && "$RECHECK" != success ]]; then
            echo "::error::The checks failed."
            exit 1
          fi
          if [[ "$DRY_RUN" == true ]]; then
            echo "### Dry run to \`$TAG\`: green" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push --force "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/lastdrop-sync/$TAG"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Only once the merge ran: a failure before it (no secrets, say) is not a stuck sync.
      - name: Open a PR
        if: failure() && (steps.merge.outcome == 'success' || steps.merge.outcome == 'failure')
        env:
          PUSH_TOKEN: ${{ secrets.LASTDROP_SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MERGED: ${{ steps.merge.outcome == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [[ -f .git/MERGE_HEAD ]]; then git merge --abort; fi
          body="$RUNNER_TEMP/body.md"
          tail_of() { [[ -s "$1" ]] || return 0; { echo "<details><summary>$2</summary>"; echo; echo '```'; tail -c 8000 "$1"; echo '```'; echo '</details>'; echo; }; }
          if [[ "$MERGED" == true ]]; then
            title="Sync to $TAG: checks failed"
            {
              echo "\`$TAG\` merged into \`lastdrop\`, but the checks failed even after Claude's attempt, so \`lastdrop\` was not moved."
              echo
              echo "This branch is \`lastdrop\` with the merge. Fix it here (FORK.md, \"Resolving a sync\"), then merge this PR and push tag \`v${TAG#v}-ld.1\` to release."
            } > "$body"
            head=HEAD
          else
            title="Sync to $TAG: merge conflict"
            {
              echo "Merging \`$TAG\` into \`lastdrop\` stopped on a conflict Claude did not resolve."
              echo
              echo "Resolve it locally, following FORK.md (\"Resolving a sync\"):"
              echo
              echo '```sh'
              echo "git fetch origin && git fetch $UPSTREAM 'refs/tags/$TAG:refs/tags/$TAG'"
              echo "git switch lastdrop && git merge $TAG"
              echo "node scripts/lastdrop/check-fork-paths.ts"
              echo "git push origin lastdrop && git push origin v${TAG#v}-ld.1"
              echo '```'
              echo
              echo "This branch is upstream's tag; the PR is a notice."
            } > "$body"
            head="refs/tags/$TAG"
          fi
          {
            echo
            echo "Then close this PR and delete \`lastdrop-sync/$TAG\`. Run: $RUN_URL"
            echo
            if [[ -s "$NOTES" ]]; then echo "## Claude's notes"; echo; cat "$NOTES"; echo; fi
            tail_of "$RUNNER_TEMP/merge.log" "Merge log"
            tail_of "$RUNNER_TEMP/checks.digest.md" "Failures (digest)"
            tail_of "$RUNNER_TEMP/recheck.log" "Checks after Claude's fix (tail)"
            tail_of "$RUNNER_TEMP/checks.log" "Checks (tail)"
            tail_of "$RUNNER_TEMP/claude-resolve.log" "Claude, resolving (tail)"
            tail_of "$RUNNER_TEMP/claude-fix.log" "Claude, fixing (tail)"
          } >> "$body"
          # GitHub refuses a PR body over 65536 characters.
          if (( $(wc -c < "$body") > 60000 )); then
            head -c 60000 "$body" > "$body.cut"
            printf '\n\n(Cut to fit. The full logs are in the run.)\n' >> "$body.cut"
            mv "$body.cut" "$body"
          fi
          if [[ "$DRY_RUN" == true ]]; then
            { echo "### Dry run to \`$TAG\`: $title"; echo; cat "$body"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push --force "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$head:refs/heads/lastdrop-sync/$TAG"
          gh label create lastdrop-sync --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "A fork update that needs attention (the app warns while one is open)" --force
          gh pr create --repo "$GITHUB_REPOSITORY" --base lastdrop --head "lastdrop-sync/$TAG" \
            --label lastdrop-sync --title "$title" --body-file "$body"
          exit 1

      - name: Claude's notes in the summary
        if: always() && steps.plan.outputs.tag != ''
        run: |
          if [[ -s "$NOTES" ]]; then
            { echo "## Claude's notes"; echo; cat "$NOTES"; } >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Move lastdrop and tag
    needs: sync
    if: needs.sync.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ needs.sync.outputs.tag }}
      HEAD_BEFORE: ${{ needs.sync.outputs.head }}
      PUSH_TOKEN: ${{ secrets.LASTDROP_SYNC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: lastdrop-sync/${{ needs.sync.outputs.tag }}
          fetch-depth: 0

      - name: Push lastdrop and the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last="$(git tag -l "${TAG}-ld.*" | sed -E 's/.*-ld\.([0-9]+)$/\1/' | sort -n | tail -1)"
          release_tag="${TAG}-ld.$(( ${last:-0} + 1 ))"
          # Moves lastdrop only if nobody pushed to it since the sync started.
          git push --force-with-lease="lastdrop:$HEAD_BEFORE" "$remote" "HEAD:refs/heads/lastdrop"
          # This sync supersedes every stuck one; deleting their branches closes their PRs.
          git ls-remote --heads origin 'lastdrop-sync/*' | awk '{ print ":" $2 }' | xargs -r git push "$remote"
          # Workflows upstream added in this sync are now on the default branch: turn them off before
          # the tag, pushed with the sync token, starts workflows (lastdrop-release.yml among them).
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | select(.state == "active") | .path' |
            while read -r path; do
              case "$(basename "$path")" in
                lastdrop-*) ;;
                *) gh workflow disable "$(basename "$path")" --repo "$GITHUB_REPOSITORY" || true ;;
              esac
            done
          # GitHub keeps disabling lastdrop-release.yml on this fork, and a tag pushed while it is
          # disabled starts no run at all.
          gh api --silent -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/lastdrop-release.yml/enable"
          git tag -a "$release_tag" -m "T3 Code ${TAG} with lastdrop"
          git push "$remote" "refs/tags/$release_tag"
          echo "Tagged $release_tag." >> "$GITHUB_STEP_SUMMARY"
